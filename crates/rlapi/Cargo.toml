[package]
name = "rocketstats-rlapi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust PsyNet client for RocketStats"

[lib]
name = "rocketstats_rlapi"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
futures-util = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
